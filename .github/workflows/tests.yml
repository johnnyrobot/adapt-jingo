name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push cancels a PR's older run; each push to main gets its own
  # group (its sha), so every main commit keeps a result.
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# Each part runs in its own environment: service pins fastapi 0.110.0 and
# tts pins 0.111.0, so they can't share one. No secrets, no model downloads:
# the suites use fixtures and mocks. pytest is pinned to tts's 8.2.0 everywhere.
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install ./engine pytest==8.2.0
      - run: python -m pytest -v
        working-directory: engine

  service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            service/requirements.txt
      # test_audio.py::test_normalize_produces_16k_mono_s16 runs a real ffmpeg
      # transcode, as the service image does.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install ./engine -r service/requirements.txt pytest==8.2.0
      - run: python -m pytest -v
        working-directory: service

  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tts/requirements*.txt
      - run: pip install -r tts/requirements-dev.txt
      - run: python -m pytest -v
        working-directory: tts
